# macOS Keychain access for unterm-profile's identity secret store.
# Pinned to 2.x; the 3.x line dropped the simple `passwords` module that
# wraps SecKeychain generic-password APIs we rely on.
# Cross-platform OS keychain access for unterm-profile's SecretStore.
# Uses Keychain on macOS, Credential Manager on Windows, libsecret /
# Secret Service via D-Bus on Linux. We picked keyring over wiring
# three platform crates by hand so all the SecretStore impls stay in
# one ~100-line file; the crate already handles the wide-string
# encoding on Windows and the D-Bus session connection on Linux.
keyring = { version = "2.3", default-features = false, features = [
  "platform-macos",
  "platform-windows",
  "linux-secret-service-rt-async-io-crypto-rust",
] }
# Hidden-prompt input for `unterm-cli profile set-secret` so vibe coders
# don't accidentally paste a token into shell history. Reads from /dev/tty
# (not stdin) so pipe-driven non-interactive flows can route around it
# via the `--from-stdin` flag in the subcommand.
rpassword = "7.3"
serde = {version="1.0", default-features=false, features = ["derive"]}
serde_json = "1.0"
serde_with = {version="2.0", features = ["chrono_0_4"]}
serde_yaml = "0.9"
serial2 = "0.2"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# Ed25519 verification for the signed-manifest envelope shipped by the
# AI-agent integration runtime. Public key is baked into the binary so a
# compromise of unterm.app DNS / CF account can't push arbitrary install
# scripts to users — every envelope is verified locally before any shell
# command from it runs.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "rand_core"] }
shared_library = "0.1"
shell-words = "1.1"
shlex = "1.1"
signal-hook = "0.3"
siphasher = "1.0.1"
smithay-client-toolkit = {version = "0.19", default-features=false}
smol = "2.0"
socket2 = "0.5"
spa = "0.3.1"
sqlite-cache = "0.1.4"
ssh2 = "0.9.3"
starship-battery = "0.10"
strsim = "0.11"
syn = "1.0"
tabout = { path = "tabout" }
tar = "0.4"
tempfile = "3.20"
terminfo = "0.9"
termios = "0.3"
# `use_image` because the surface crate's cells can carry images and termwiz
# matches on them exhaustively; wezterm-term used to be what asked for it.
termwiz = { version="0.24.0", path = "termwiz", features = ["use_image"] }
