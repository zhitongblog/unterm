[workspace]
members = [
  "bidi",
  "wezterm-blob-leases",
  "wezterm-cell",
  "wezterm-escape-parser",
  "wezterm-dynamic",
  "unterm-app",
  "unterm-cli",
  "unterm-mcp",
  "unterm-render",
  "unterm-settings",
  "unterm-services",
  "wezterm-surface",
  "unterm-engine",
  "unterm-profile",
  "unterm-agents",
  "unterm-protocol",
  "unterm-core",
  "unterm-tasks",
  "unterm-gateway",
  "unterm-brain",
  "unterm-providers",
]
resolver = "2"
exclude = [
  "termwiz/codegen",
  "wezterm-char-props/codegen",
]

[workspace.package]
version = "0.71.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# strip symbols by default to keep release artifacts small (~50% smaller).
# To debug a panic with useful backtraces, temporarily flip to:
#   strip = "none"
#   debug = "line-tables-only"
# and rebuild. backtrace::Backtrace::new() then resolves frames to real
# Rust function names and file:line locations (verified against v0.14-rc3
# during the v0.15 config_builder hunt). Flip back before tagging or the
# release zip grows ~40 MB from .pdb / DWARF tables.
strip = "symbols"
panic = "abort"

[profile.dev]
# https://jakedeichert.com/blog/reducing-rust-incremental-compilation-times-on-macos-by-70-percent/
# Disabled because it breaks builds on Windows
#split-debuginfo = "unpacked"

