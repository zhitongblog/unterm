[package]
name = "unterm-services"
version = "0.1.0"
edition = "2021"
publish = false

# Unterm's own product services, which had been living inside the WezTerm GUI
# crate. None of them are about WezTerm: they are the instance registry, the
# agent cockpit, proxy control and command suggestion. Moving them here is what
# lets a second front end have them, and what takes them out of the crate that
# is being retired.

[features]
# Test helpers other crates need, kept out of shipped binaries.
test-support = []

[dependencies]
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
unterm-engine = { path = "../unterm-engine" }
chrono = { workspace = true, features = ["clock"] }
uuid = { workspace = true, features = ["v4"] }
dirs-next.workspace = true
regex.workspace = true
base64.workspace = true
hostname.workspace = true
portable-pty.workspace = true
unterm-profile.workspace = true
unterm-protocol.workspace = true
unterm-gateway.workspace = true
unterm-tasks.workspace = true
sha2.workspace = true
reqwest.workspace = true
unterm-brain.workspace = true
unterm-providers.workspace = true

# Killing a process group and asking whether a pid is still alive have no
# portable form; both are raw syscalls on Unix and Win32 calls on Windows.
[target."cfg(unix)".dependencies]
libc.workspace = true

# Finding a window's CGWindowID, and reading back what `screencapture` wrote.
[target."cfg(target_os = \"macos\")".dependencies]
core-foundation.workspace = true
core-graphics.workspace = true
png.workspace = true

[target."cfg(windows)".dependencies]
winapi = { workspace = true, features = ["handleapi", "jobapi2", "processthreadsapi", "winnt", "synchapi", "errhandlingapi", "consoleapi", "wincon", "winuser", "wingdi", "psapi", "sysinfoapi", "winbase", "minwindef", "shellapi", "libloaderapi", "tlhelp32", "jobapi", "sddl", "securitybaseapi", "minwinbase"] }
winreg.workspace = true

[dev-dependencies]
tempfile.workspace = true
