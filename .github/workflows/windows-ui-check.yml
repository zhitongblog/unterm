name: windows-ui-check

# Builds Unterm on a Windows desktop runner and drives the window: caption
# hit-testing (what Snap layouts rely on), hover and maximise, and the
# administrator window. Screenshots are uploaded for review.
on:
  workflow_dispatch:
  push:
    branches: ["feat/windows-**", "feat/site-**"]

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        # 2022 has no Mica; 2025 is built on Windows 11 24H2.
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p unterm-app -p unterm-core -p unterm-cli
      - name: Drive the window
        shell: pwsh
        run: .\ci\windows-ui-check.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-check-${{ matrix.os }}
          path: ui-check
