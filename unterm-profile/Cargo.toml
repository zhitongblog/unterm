[package]
name = "unterm-profile"
version = "0.71.5"
authors = ["Alex <lixd220@gmail.com>"]
edition = "2021"
publish = false

# Identity profile system for Unterm: TOML schema for per-window
# identities (GitHub / AWS / npm tokens, git identity, SSH key routing),
# slugified IDs derived from user-typed display names, and a platform-
# native secret-store abstraction (macOS Keychain, Windows Credential
# Manager, Linux Secret Service via D-Bus). The wezterm-gui binary and
# the unterm-cli subcommand surface both depend on this crate so the
# TOML schema, ID derivation, and keychain access stay consistent
# across the GUI and the CLI.
#
# See project_identity_profiles_design.md for the locked design.

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Need `std` (which implies `alloc`) so the `Engine::decode -> Vec<u8>`
# convenience is available — workspace-level base64 turns default-features
# off for binary size, but the sniffer code needs Vec output for the
# Docker auth base64-decode path.
base64 = { workspace = true, features = ["std"] }
toml.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
dirs-next.workspace = true
log.workspace = true
unterm-protocol.workspace = true
# Cross-platform OS keychain. Backend selection is at compile time via
# `keyring` feature flags in the workspace Cargo.toml — Keychain on
# macOS, Credential Manager on Windows, Secret Service (D-Bus +
# libsecret) on Linux. One trait impl (`store_keyring.rs`) covers all
# three; no per-OS module needed.
keyring.workspace = true

[dev-dependencies]
