[package]
name = "unterm-cli"
version.workspace = true
edition = "2021"
publish = false

# Unterm's command line. Talks to a running Unterm over its MCP server, or to
# the files under ~/.unterm -- never to a window, which is why it builds
# without any of the front end.

[[bin]]
name = "unterm-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
clap_complete.workspace = true
dirs-next.workspace = true
hostname.workspace = true
humantime.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
rpassword.workspace = true
tabout.workspace = true
tempfile.workspace = true
toml.workspace = true
unterm-agents.workspace = true
unterm-profile.workspace = true
unterm-services.workspace = true
unterm-settings.workspace = true
unterm-protocol.workspace = true

# Asking whether a pid is still alive is a raw syscall on Unix.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["winuser", "processthreadsapi", "handleapi", "winbase"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = { workspace = true }
